{% if st %}
{% set state = 'paused' if st.paused else ('done' if st.finished else ('lost' if st.stopped else 'live')) %}
<div class="clock" data-run-state="{{ state }}" title="{{ st.sim_now|fulltime }}. {{ st.events_done }} of {{ st.events_total }} readings processed.">
  <div>
    <div class="clock-time" aria-label="Fleet time {{ st.sim_now|clock }}">{{ st.sim_now|clock }}<small>{{ st.sim_now|dayname }} fleet time</small></div>
  </div>
  <div aria-hidden="true">
    <div class="daystrip" title="Progress through the fleet day"><i style="width: {{ st.sim_now|daypct }}%"></i><b style="left: {{ st.sim_now|daypct }}%"></b></div>
    <div class="daystrip-labels"><span>12am</span><span>6</span><span>noon</span><span>6</span><span>12</span></div>
  </div>
</div>
{% endif %}

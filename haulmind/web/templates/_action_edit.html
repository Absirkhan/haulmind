{% from "_macros.html" import icon %}
{% set e = edit %}
<article class="detail-card" aria-labelledby="edit-title">
  <h2 id="edit-title">Change the details</h2>
  <p class="muted" style="margin-top:.35rem">{{ e.title }}. Your changes are what Haulmind will carry out once you approve.</p>
  <form hx-post="/actions/{{ e.id }}/edit" hx-target="#detail" hx-swap="innerHTML">
    {% for f in e.fields %}
    <div class="field">
      <label for="arg_{{ f.key }}">{{ f.label }}</label>
      {% if f.kind == 'select' %}
        <select class="input" id="arg_{{ f.key }}" name="arg_{{ f.key }}">
          {% for value, text in f.options %}<option value="{{ value }}" {{ 'selected' if value == f.value }}>{{ text }}</option>{% endfor %}
        </select>
      {% elif f.kind == 'textarea' %}
        <textarea class="input" id="arg_{{ f.key }}" name="arg_{{ f.key }}">{{ f.value }}</textarea>
      {% else %}
        <input class="input" type="text" id="arg_{{ f.key }}" name="arg_{{ f.key }}" value="{{ f.value }}">
      {% endif %}
    </div>
    {% endfor %}
    <div class="decide">
      <button class="btn btn-primary" type="submit">{{ icon("check") }} Save changes</button>
      <button class="btn btn-quiet" type="button" hx-get="/actions/{{ e.id }}" hx-target="#detail" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
</article>

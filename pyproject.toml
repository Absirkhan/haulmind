[project]
name = "haulmind"
version = "0.1.0"
description = "Autonomous operations agent for fleet managers: watches a telematics event stream, investigates incidents, and queues ready-to-approve actions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "mcp>=1.2",
    "google-genai>=1.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "structlog>=24.1",
    "httpx>=0.27",
    "honcho>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haulmind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["haulmind/migrations/versions"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "B008", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["haulmind", "evals"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# tool descriptions, prompt text and summary templates are prose; the formatter cannot wrap them
"haulmind/mcp_server/server.py" = ["E501"]
"haulmind/mcp_server/tools.py" = ["E501"]
"haulmind/llm/stub.py" = ["E501"]
"haulmind/agents/evidence.py" = ["E501"]
"haulmind/agents/prompts.py" = ["E501"]
"evals/run_eval.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["haulmind/migrations/"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "honcho.*", "langgraph.*", "google.genai.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
